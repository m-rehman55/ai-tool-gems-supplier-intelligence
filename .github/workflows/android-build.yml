name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Telegram Supplier Price Finder v1.0.6 (Bot Catalog Intelligence & Resale Margin Calculator)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 Telegram Supplier Price Finder v1.0.6 (Direct APK Download)

            Direct `.apk` file for Android phones with Advanced Supplier Intelligence (SI / AI) & Autonomous Catalog Extraction:
            - **Per-Bot Product Portfolio & Catalog Viewer**: Tap **📦 Catalog** on any supplier bot to inspect all harvested tools, duration, access model, stock, and warranty.
            - **🇵🇰 Pakistan Resale Profit Margin Calculator**: Automatically calculates Pakistani retail selling prices with custom profit margins (+20%, +30%, or +Rs. 500 fixed markup) auto-rounded to nearest Rs. 50.
            - **1-Click WhatsApp Customer Quotations**: Instant copy formatted, professional quotations ready to dispatch to Pakistani buyers on WhatsApp or paste into `aitoolgems.tech`.
            - **Price Fluctuation History & Market Trends**: Tracks price drops and increases across all bots over time.
            - **Telegram-Native Discovery**: Discovers live shop bots directly from your authenticated Telegram account dialogs (`ChatTypePrivate` + `UserTypeBot`).
            - **Active Menu Resumption**: Reuses active keyboards without sending redundant `/start` to existing bots.
            - **Search Policies**: Supports `⚡ Fast Lookup` and `🌐 Exhaustive Crawl`.
            - **Optimized ARM APK**: Pre-packaged with native TDLib binaries for arm64-v8a and armeabi-v7a.

            #### ⚠️ Installation Note:
            If you previously installed an older version on your phone, **uninstall (delete) the old app first**, then download and install `app-debug.apk`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
