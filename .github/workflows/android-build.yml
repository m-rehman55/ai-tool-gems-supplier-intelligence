name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Telegram Supplier Price Finder v1.0.8 (Authorized Reseller Hubs & Intelligence Release)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 Telegram Supplier Price Finder v1.0.8 (Executive Release)

            Direct `.apk` file for Android phones with Advanced Supplier Intelligence (SI / AI) & Autonomous Catalog Extraction:
            - **⚡ Authorized Reseller API Hubs**: Direct live integration with Bunny AI Reseller Hub (`https://bunnytoolsbot.tech`) and Canboso Wholesale API (`https://canboso.com`), syncing 600+ live AI tool offers.
            - **🛡️ Fail-Closed Safety Boundary**: Read-only catalog and price extraction only. Automatic purchasing, wallet transactions, and irreversible checkout buttons are strictly blocked.
            - **🔐 Android Keystore Protection**: Hardware-backed encryption via `SecureStorage` for Telegram MTProto and Reseller API credentials.
            - **🇵🇰 Pakistan Resale Profit Margin Calculator**: Automatically calculates Pakistani retail selling prices with custom profit margins (+20%, +30%, or +Rs. 500 fixed markup) auto-rounded to nearest Rs. 50.
            - **📦 Per-Bot Catalog Profiler**: Inspect full product inventory, durations, access models (Private, Shared, Team, API, Key), stock, and stated warranties.
            - **1-Click WhatsApp Quotations**: Fast customer quotes formatted and ready for Pakistani buyers or posting to `aitoolgems.tech`.
            - **Multi-Source Classification**: Granular filtering by `🤖 Telegram Discovered`, `⚡ Authorized API`, and `📦 Seed / Demo`.
            - **Price History & Fluctuations**: Tracks chronological price increases and drops across all suppliers.
            - **Optimized ARM APK**: Pre-packaged native TDLib binaries for arm64-v8a and armeabi-v7a.

            #### ⚠️ Installation Note:
            If you previously installed an older version on your phone, **uninstall (delete) the old app first**, then download and install `app-debug.apk`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
