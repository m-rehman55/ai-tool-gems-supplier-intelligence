[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tool-gems-supplier-intelligence"
version = "1.0.0"
description = "Private Supplier Price Intelligence & Procurement System for AIToolGems Pakistan"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Tool Gems", email = "procurement@aitoolgems.tech" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "rapidfuzz>=3.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
