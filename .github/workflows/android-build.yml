name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release (Optional on Main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Telegram Supplier Price Finder v1.0.0 (Android APK)"
          body: |
            ### 📱 Telegram Supplier Price Finder for Android

            - **Mobile-First APK:** Runs completely standalone on your phone without needing a computer running.
            - **Live Supplier Search:** Inspects configured bot offers and compares like-for-like plans.
            - **Rule 9 Winner Engine:** Enforces verified vs unverified distinctions and displays the cheapest verified quote.
            - **Strict No-Purchase Boundary:** Automated checkout, wallet deposits, and payments are strictly intercepted and blocked.
            - **Local Keystore Security:** Encrypted SharedPreferences protect session credentials on-device.

            #### Installation Instructions:
            1. Download `app-debug.apk` onto your Android phone.
            2. Tap the APK file to install (allow "Install from Unknown Sources" if prompted).
            3. Open the app, enter your search query (e.g., `ChatGPT Plus`), and tap **Search Suppliers**.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
