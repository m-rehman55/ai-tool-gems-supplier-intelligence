name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Telegram Supplier Price Finder v1.0.5 (Telegram-Native Discovery & Autonomous Bot Intelligence)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 Telegram Supplier Price Finder v1.0.5 (Direct APK Download)

            Direct `.apk` file for Android phones with Telegram-Native Discovery & Autonomous Product Intelligence:
            - **Telegram-Native Bot Discovery**: Discovers eligible supplier bots directly from your authenticated Telegram account dialogs (`ChatTypePrivate` + `UserTypeBot`). Segregates seed demo suppliers from live account bots.
            - **Existing Bot vs New Bot**: Checks chat history first; resumes active keyboard menus without sending redundant `/start` to existing bots.
            - **Target Product Aliases & Ranked Menus**: Ranks navigation buttons according to target tool aliases (e.g. Canva Pro, ChatGPT Plus, CapCut Pro) to explore relevant branches first.
            - **Search Policies**: Supports `⚡ Fast Lookup` (stops once target product variants are extracted) and `🌐 Exhaustive Crawl` (explores all safe branches and pagination).
            - **Honest Search Exhaustion**: Never skips unfinished bots; records truthful states (`SEARCH_POLICY_SATISFIED`, `SEARCH_EXHAUSTED_NOT_FOUND`, `PARTIAL`, `MEMBERSHIP_GATE`).
            - **One Bot Per Scan Deduplication**: Guarantees each supplier bot is processed at most once per scan run.
            - **Optimized ARM APK**: Pre-packaged with native TDLib binaries for arm64-v8a and armeabi-v7a.

            #### ⚠️ Installation Note:
            If you previously installed an older version on your phone, **uninstall (delete) the old app first**, then download and install `app-debug.apk`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
