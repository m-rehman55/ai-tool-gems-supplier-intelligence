name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Telegram Supplier Price Finder v1.0.2 (Genuine MTProto & TDLib)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 Telegram Supplier Price Finder v1.0.2 (Direct APK Download)

            Download the direct `.apk` file below directly onto your Android phone:
            - **Genuine Telegram MTProto Authentication (TDLib)**: Direct connection to Telegram DC servers; triggers official 5-digit verification codes to your active Telegram accounts.
            - **Wholesale Search Fix**: Seed catalog now includes ChatGPT, Canva Pro, Google Gemini, Claude, and Netflix wholesale plans.
            - **No ZIP extraction needed**: Tap `app-debug.apk` directly to install.
            - **Signed with stable keystore** (`v1` and `v2` signatures enabled).
            - **Supports Android 7.0 Nougat to Android 14** (`minSdk = 24`).

            #### ⚠️ Installation Note:
            If you previously installed an older build, please **uninstall the old version first**, then install `app-debug.apk`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
