name: Android APK Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSupplierPriceFinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Telegram Supplier Price Finder v1.0.4 (Adaptive Bot Crawler & Catalog Extraction)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 Telegram Supplier Price Finder v1.0.4 (Direct APK Download)

            Direct `.apk` file for Android phones with Adaptive Telegram Bot Crawler:
            - **Adaptive Bot Crawler**: Intelligently navigates bot menus (reply & inline keyboards, message edits, pagination, back-navigation).
            - **Multi-Variant Extraction**: Safely extracts all pricing tiers (1-day, 1-month, 4-month, 1-year) with durable source evidence.
            - **Deterministic Safety Boundary**: Hard-blocks payment/checkout/deposit buttons (`Buy Now`, `Pay`, `Checkout`); bare `Buy` flags an interactive approval dialog once and stores a verified playbook.
            - **Gate & Side-Effect Approval**: Detects required group/channel gates and requires explicit user consent before any account actions.
            - **Truthful Provenance**: Distinguishes `LIVE_OBSERVED_UNVERIFIED`, `CACHED`, `SEED_CATALOG`, and `VERIFIED` statuses.
            - **Optimized ARM APK**: Pre-packaged with native TDLib binaries for arm64-v8a and armeabi-v7a.

            #### ⚠️ Important Installation Note:
            If you previously installed an older version on your phone, **please uninstall (delete) the old app first**, then download and install `app-debug.apk`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
